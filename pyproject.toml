[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tunefetch"
version = "1.0.0"
description = "Search music across several sources and download the best available audio quality."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
dependencies = ["yt-dlp"]

[project.scripts]
tunefetch = "tunefetch.cli:main"

[dependency-groups]
dev = ["pytest"]

[tool.hatch.build.targets.wheel]
packages = ["src/tunefetch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
